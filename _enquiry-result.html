<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Enquiry response · 3 Harbour House</title>
</head>
<body>
  <script>
    (()=>{
      const params=new URLSearchParams(location.search);
      const requestId=params.get('request_id')||'';
      const status=params.get('status')||'';
      if(!/^hh-[a-zA-Z0-9-]{16,100}$/.test(requestId)||!['accepted','partial','failed'].includes(status))return;
      // Apps Script HtmlService wraps this response in its own sandbox iframe.
      // Skip that wrapper and message the Harbour House page that submitted the
      // form. The page accepts replies only from this exact nested frame and
      // matching request ID/status; no guest details are sent in this message.
      window.parent.parent.postMessage({channel:'harbour-house-enquiry',requestId,status},'*');
    })();
  </script>
</body>
</html>
